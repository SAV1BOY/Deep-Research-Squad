# ----------------------------------------------------------------------------
# Quality Gates
# ----------------------------------------------------------------------------
quality_gates:

  mandatory:
    - gate: source-verification
      description: "Every cited source must be verified as accessible, current, and authoritative"
      enforced_by: evidence-verifier
      threshold: "100% of cited sources verified"

    - gate: confidence-calibration
      description: "Confidence levels must be calibrated against evidence strength, not intuition"
      enforced_by: research-auditor
      threshold: "All claims tagged with evidence-backed confidence scores"

    - gate: contrarian-review
      description: "No thesis reaches synthesis without at least one adversarial challenge pass"
      enforced_by: contrarian-analyst
      threshold: "Minimum 1 contrarian pass per thesis"

    - gate: bias-audit
      description: "Check for confirmation bias, selection bias, and source homogeneity"
      enforced_by: research-auditor
      threshold: "Bias score below 0.2 on internal rubric"

    - gate: question-coverage
      description: "All decomposed sub-questions must be addressed with evidence or marked as gaps"
      enforced_by: deepresearch-chief
      threshold: "100% sub-question coverage or explicit gap declaration"

    - gate: recency-check
      description: "Time-sensitive research must use sources within acceptable recency windows"
      enforced_by: timeline-analyst
      threshold: "Primary sources within domain-appropriate recency window"

    - gate: cross-reference-minimum
      description: "Key claims must be corroborated by multiple independent sources"
      enforced_by: evidence-verifier
      threshold: "Minimum 2 independent sources per key claim"

    - gate: decision-readiness
      description: "Decision briefs must contain clear recommendations, risk assessment, and confidence bands"
      enforced_by: decision-analyst
      threshold: "All three components present and internally consistent"

  per_domain:
    financial:
      - "Numerical claims verified against primary filings (SEC, annual reports)"
      - "Currency and date normalization applied"
      - "Forward-looking statements clearly labeled as projections"

    legal:
      - "Jurisdiction explicitly stated for all legal claims"
      - "Case law citations verified against official records"
      - "Regulatory status checked against current enforcement"

    medical:
      - "Clinical claims traced to peer-reviewed studies"
      - "Sample sizes and study design reported"
      - "Regulatory approval status verified (FDA, EMA, etc.)"

    technology:
      - "Technical claims verified against official documentation"
      - "Version numbers and release dates confirmed"
      - "Open-source license compliance checked"

    geopolitical:
      - "Multiple regional perspectives included"
      - "Source government affiliations disclosed"
      - "Timeline of events independently verified"

# ----------------------------------------------------------------------------
# KPIs
# ----------------------------------------------------------------------------
kpis:

  research_quality:
    - metric: evidence-density-score
      description: "Ratio of evidence-backed claims to total claims in output"
      target: ">= 0.90"
      measurement: "Automated count via research-auditor"

    - metric: source-diversity-index
      description: "Shannon diversity index across source types, geographies, and viewpoints"
      target: ">= 2.5"
      measurement: "Computed per deliverable"

    - metric: confidence-calibration-accuracy
      description: "How well stated confidence levels predict actual accuracy over time"
      target: "Brier score <= 0.15"
      measurement: "Quarterly retrospective scoring"

    - metric: contrarian-survival-rate
      description: "Percentage of theses that survive adversarial review without material revision"
      target: "60-80% (too high suggests weak contrarian; too low suggests weak research)"
      measurement: "Per-engagement tracking"

  efficiency:
    - metric: time-to-first-brief
      description: "Elapsed time from research commission to first draft brief"
      target: "Domain-dependent; tracked against rolling average"
      measurement: "Timestamp delta"

    - metric: source-hit-rate
      description: "Percentage of identified sources that yield usable evidence"
      target: ">= 0.50"
      measurement: "Source-hunter tracking log"

    - metric: rework-rate
      description: "Percentage of deliverables requiring revision after quality gate"
      target: "<= 0.15"
      measurement: "Audit pass/fail log"

    - metric: sub-question-resolution-rate
      description: "Percentage of sub-questions resolved per research cycle"
      target: ">= 0.85"
      measurement: "Scope-mapper tracking"

  impact:
    - metric: decision-adoption-rate
      description: "Percentage of research recommendations adopted by decision-makers"
      target: ">= 0.70"
      measurement: "Post-decision follow-up survey"

    - metric: prediction-accuracy
      description: "Accuracy of forward-looking assessments when verifiable"
      target: ">= 0.65"
      measurement: "Quarterly prediction scorecard"

    - metric: stakeholder-satisfaction
      description: "Decision-maker satisfaction with research quality and usefulness"
      target: ">= 4.2 / 5.0"
      measurement: "Post-engagement feedback"

    - metric: cross-squad-utility
      description: "How often research outputs are referenced by other squads"
      target: ">= 3 cross-squad references per deliverable"
      measurement: "Asset reference tracking"

  operational:
    - metric: registry-freshness
      description: "Percentage of registry entries updated within their recency window"
      target: ">= 0.90"
      measurement: "Automated registry audit"

    - metric: pipeline-completion-rate
      description: "Percentage of research engagements that complete the full pipeline"
      target: ">= 0.85"
      measurement: "Pipeline stage tracking"

    - metric: quality-gate-pass-rate
      description: "First-pass rate through mandatory quality gates"
      target: ">= 0.80"
      measurement: "Gate log aggregation"

    - metric: agent-utilization
      description: "Percentage of available agent capacity actively engaged"
      target: "70-90% (avoids both idle time and burnout)"
      measurement: "Task assignment tracking"

# ----------------------------------------------------------------------------
# Defaults
# ----------------------------------------------------------------------------
defaults:
  confidence_scale: "0.0-1.0 (0 = no evidence, 1 = incontrovertible)"
  default_confidence_threshold: 0.6
  max_sub_questions: 12
  min_sources_per_claim: 2
  recency_window_days: 365
  contrarian_passes: 1
  synthesis_format: "structured-brief"
  evidence_format: "claim-source-confidence triad"
  output_directory: "data/research"
  archive_directory: "archive"
  log_level: "info"
  timezone: "UTC"
  language: "en"
  citation_style: "APA-7"
  max_report_pages: 25
  executive_summary_max_words: 500

# ----------------------------------------------------------------------------
# Escalation Protocols
# ----------------------------------------------------------------------------
escalation_protocols:

  gate_failure:
    consecutive_failure_threshold: 2
    actions:
      - at_failures: 2
        action: "chief-intervention"
        description: >
          After 2 consecutive quality gate failures on the same artifact,
          the Chief Research Architect intervenes directly — reviews the
          artifact, diagnoses root cause, and issues targeted remediation
          instructions to the responsible agent.
      - at_failures: 3
        action: "task-rescope"
        description: >
          After 3 consecutive failures, the task is returned to the
          Scope Mapper for re-decomposition. The original sub-question is
          split into smaller, more tractable components and reassigned
          with adjusted quality thresholds.

  agent_stall:
    description: >
      Maximum allowed time per pipeline stage before the Chief Research
      Architect is notified and reassignment or escalation is triggered.
    timeouts:
      planning: "30min"
      collection: "60min"
      verification: "45min"
      synthesis: "45min"
      decision: "30min"
      audit: "20min"
    on_timeout:
      - action: "notify-chief"
        description: "Alert the Chief Research Architect with stage, agent, and elapsed time"
      - action: "reassign-or-assist"
        description: >
          Chief may reassign to a fallback agent, split the task, or
          inject additional context to unblock the stalled agent.

  kpi_breach:
    description: >
      When a tracked KPI crosses its threshold, the Chief Research Architect
      is notified for review and corrective action.
    thresholds:
      - kpi: evidence-density-score
        breach_condition: "< 0.90"
        action: "chief-review — return to collection for additional sourcing"
      - kpi: source-diversity-index
        breach_condition: "< 2.5"
        action: "chief-review — expand source strategy with alternative source types"
      - kpi: rework-rate
        breach_condition: "> 0.15"
        action: "chief-review — audit upstream stages for systemic quality issues"
      - kpi: quality-gate-pass-rate
        breach_condition: "< 0.80"
        action: "chief-review — identify failing gates and retrain responsible agents"
      - kpi: pipeline-completion-rate
        breach_condition: "< 0.85"
        action: "chief-review — investigate abandonment causes and process bottlenecks"

  cross_squad_failure:
    description: >
      Protocols for when a cross-squad handoff is declined, delayed, or
      returns incomplete results.
    actions:
      - trigger: "handoff-declined"
        action: >
          Chief Research Architect notifies the requesting squad, logs the
          decline reason, and attempts an alternative squad or internal
          workaround within 30 minutes.
      - trigger: "handoff-delayed"
        timeout: "60min"
        action: >
          If the receiving squad has not acknowledged within 60 minutes,
          the Chief escalates to advisory-board shared channel and begins
          internal fallback research in parallel.
      - trigger: "handoff-incomplete"
        action: >
          Chief reviews returned artifacts against the original request
          spec, identifies gaps, and either requests remediation from the
          receiving squad or fills gaps internally.

# ----------------------------------------------------------------------------
# Error Handling
# ----------------------------------------------------------------------------
error_handling:

  retry_policy:
    max_retries: 3
    backoff_strategy: "exponential"
    backoff_base_seconds: 10
    backoff_multiplier: 2
    description: >
      Each agent action is retried up to 3 times on failure.
      Backoff intervals: 10s, 20s, 40s. After 3 failures the
      action is marked as failed and escalated per escalation_protocols.

  fallback_agents:
    description: >
      When a primary agent is unavailable or repeatedly failing, these
      substitutes can assume the role with reduced but acceptable coverage.
    substitutions:
      - primary: scope-mapper
        fallback: research-architect
        capability_coverage: "90%"
        notes: "Research Architect can decompose questions but lacks Scope Mapper's MECE specialization"
      - primary: literature-analyst
        fallback: reference-intellectual
        capability_coverage: "80%"
        notes: "Reference Intellectual covers academic context but not systematic review protocols"
      - primary: timeline-analyst
        fallback: data-researcher
        capability_coverage: "75%"
        notes: "Data Researcher can handle temporal data but lacks Timeline Analyst's trend projection models"

  recovery_workflows:
    description: >
      When a pipeline stage fails after exhausting retries, these workflows
      define the recovery path to maintain pipeline continuity.
    stages:
      - failed_stage: collection
        recovery_action: "alternative-source-strategy"
        description: >
          Route back to Source Hunter and Query Strategist to design an
          alternative source plan using different databases, search terms,
          or collection methods. Discovery Scout is activated to find
          unconventional sources.
        recovery_agents:
          - source-hunter
          - query-strategist
          - discovery-scout

      - failed_stage: verification
        recovery_action: "expanded-collection"
        description: >
          Return to collection stage with expanded source requirements.
          Minimum source count is doubled and source type diversity is
          enforced to provide stronger corroboration paths.
        recovery_agents:
          - data-researcher
          - source-hunter
          - evidence-verifier

      - failed_stage: synthesis
        recovery_action: "verification-gap-fill"
        description: >
          Return to verification stage to identify and fill evidence gaps
          that prevented coherent synthesis. Evidence Verifier produces a
          gap report and collection is targeted to fill specific holes.
        recovery_agents:
          - evidence-verifier
          - data-researcher
          - synthesis-writer

