# ----------------------------------------------------------------------------
# SLAs — per-stage time budgets and cross-squad commitments
# ----------------------------------------------------------------------------
slas:

  per_stage:
    description: >
      Maximum time budgets for each pipeline stage. Stages exceeding their
      SLA trigger escalation per escalation_protocols.agent_stall.
    budgets:
      - stage: scope-decomposition
        max_duration: "30min"
        agents: ["scope-mapper", "query-strategist"]
      - stage: source-planning
        max_duration: "30min"
        agents: ["source-hunter", "query-strategist", "discovery-scout"]
      - stage: primary-collection
        max_duration: "60min"
        agents: ["data-researcher", "source-hunter", "osint-investigator"]
      - stage: evidence-verification
        max_duration: "45min"
        agents: ["evidence-verifier", "contrarian-analyst"]
      - stage: synthesis
        max_duration: "45min"
        agents: ["synthesis-writer", "insight-modeler"]
      - stage: decision-brief
        max_duration: "30min"
        agents: ["decision-analyst", "synthesis-writer"]
      - stage: quality-audit
        max_duration: "20min"
        agents: ["research-auditor", "deepresearch-chief"]

  cross_squad:
    description: >
      SLAs governing handoff responsiveness and artifact quality when
      working with external squads.
    commitments:
      - type: "handoff-acknowledgment"
        sla: "30min"
        description: "Receiving squad must acknowledge a handoff request within 30 minutes"
      - type: "artifact-delivery"
        sla: "4h"
        description: "Requested research artifacts delivered within 4 hours of acknowledgment"
      - type: "fact-check-turnaround"
        sla: "2h"
        description: "Fact-check and verification requests completed within 2 hours"
      - type: "urgent-intelligence"
        sla: "1h"
        description: "Urgent competitive intelligence requests receive initial findings within 1 hour"
      - type: "revision-response"
        sla: "2h"
        description: "Revision requests on delivered artifacts addressed within 2 hours"
