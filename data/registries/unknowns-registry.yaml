# Unknowns Registry
# Track unknown unknowns and knowledge boundaries

description: >
  Registry for tracking what we do not know and what we do not know
  that we do not know. Captures knowledge boundaries, blind spots,
  and areas where our confidence exceeds our evidence base.

schema:
  fields:
    - name: unknown_id
      type: string
      required: true
      description: Unique identifier (format: UNK-YYYY-NNN)
    - name: description
      type: string
      required: true
      description: Description of the unknown or knowledge gap
    - name: unknown_type
      type: enum
      values: [known_unknown, discovered_unknown, assumption_at_risk, blind_spot]
      description: Classification of the unknown type
    - name: domain
      type: string
      required: true
      description: Domain where the unknown exists
    - name: impact_if_wrong
      type: enum
      values: [catastrophic, major, moderate, minor]
      description: Impact if our assumptions about this area are wrong
    - name: investigation_priority
      type: enum
      values: [urgent, high, medium, low, watch]
      description: Priority for investigating this unknown
    - name: discovered_in_project
      type: string
      description: Project where this unknown was identified
    - name: related_claims
      type: list
      description: Claim IDs that might be affected by this unknown
    - name: date_identified
      type: date
      description: Date the unknown was first recognized
    - name: mitigation_strategy
      type: string
      description: How we are managing the risk of this unknown

example_entry:
  unknown_id: "UNK-2026-014"
  unknown_type: "discovered_unknown"
  description: "We lack data on how AI regulation in the EU will affect US market dynamics"
  domain: "artificial_intelligence"
  impact_if_wrong: "major"
  investigation_priority: "high"
  discovered_in_project: "market-intel-003"
  related_claims: ["CLM-2026-042", "CLM-2026-080"]
  date_identified: "2026-03-05"
  mitigation_strategy: "Monitor EU regulatory pipeline; scenario plan for both outcomes"

usage_notes:
  - Actively seek to discover new unknowns in every project
  - Blind spots are the most dangerous; use external review to find them
  - High-impact unknowns should trigger dedicated research projects
  - Review quarterly to reclassify or resolve identified unknowns
